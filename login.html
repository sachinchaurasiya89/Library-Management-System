<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Libra Library System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Special styling just for the login screen */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--navy);
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-box label {
      display: block;
      margin: 15px 0 5px;
      font-size: 12px;
      font-weight: 650;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .error-msg {
      color: #d93025;
      background: #fce8e6;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 15px;
      display: none; /* Hidden by default */
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="brand" style="justify-content: center; padding-bottom: 25px;">
      <div class="brand-icon">L</div>
      <div>
        <h2>Libra</h2>
        <small style="color: var(--muted)">ADMIN LOGIN</small>
      </div>
    </div>

    <form id="loginForm">
      <div id="loginError" class="error-msg">Invalid username or password!</div>
      
      <label for="username">Username</label>
      <input type="text" id="username" required placeholder="Enter username">
      
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Enter password">
      
      <button type="submit" class="primary-btn" style="width: 100%; padding: 14px; font-size: 14px;">Login to Dashboard</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault(); // Stop page from refreshing
      
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      
      try {
        const response = await fetch("http://localhost:3000/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });
        
        const result = await response.json();
        
        if (result.success) {
          // Store a secret key in the browser to remember we are logged in!
          localStorage.setItem("isLoggedIn", "true");
          // Add this line right next to where you set isLoggedIn = "true"
          localStorage.setItem("activeAdmin", document.getElementById("username").value);
          // Redirect to the main dashboard
          window.location.href = "index.html";
        } else {
          // Show error message
          document.getElementById("loginError").style.display = "block";
        }
      } catch (error) {
        alert("Cannot connect to server. Is Nodemon running?");
      }
    });
  </script>
</body>
</html>
